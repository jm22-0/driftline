name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # 钉死版本而不是 ubuntu-latest:latest 滚到 26.04 那次,当时钉的 Playwright 不认
    # 新系统,`playwright install --with-deps` 直接退出 —— 和被测的代码无关也会红。
    # 换镜像要和 Playwright 支持的系统一起核,所以由人来改,不让它自己滚。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # runner 无 GPU,WebGL 走 SwiftShader 软件渲染(参数在 playwright.config.ts)
      - name: Visual smoke tests
        run: npm run test:visual

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/visual/__output__/
          if-no-files-found: warn
          retention-days: 14
